name: Clean Architecture CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-ve-mimari-denetim:
    name: Pytest (Mimari, Birim ve Entegrasyon)
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu indir (Checkout)
        uses: actions/checkout@v4

      - name: Python 3.12 kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Bağımlılıkları yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: AST Mimari Bağımlılık Denetimi (tests/architecture)
        run: python -m pytest tests/architecture -v

      - name: Domain Birim Testleri (tests/unit)
        run: python -m pytest tests/unit -v

      - name: Çift Depo Entegrasyon Testleri - Memory ve SQLite (tests/integration)
        run: python -m pytest tests/integration -v

  docker-imaj-dogrulama:
    name: Docker İmaj Derleme Doğrulaması
    runs-on: ubuntu-latest
    needs: test-ve-mimari-denetim

    steps:
      - name: Depoyu indir (Checkout)
        uses: actions/checkout@v4

      - name: Docker imajını derle
        run: docker build -t gorev-yonetim-sistemi:ci .
